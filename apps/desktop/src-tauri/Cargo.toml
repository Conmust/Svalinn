[package]
name = "svalinn-desktop"
version = "0.1.0"
description = "A lightweight, privacy-focused communication platform"
authors = ["Svalinn Team"]
license = "AGPL-3.0"
repository = ""
edition = "2021"

[lib]
name = "svalinn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Native OS notifications for new messages/mentions (see
# `lib/notifications.ts`). Works on both desktop and mobile, unlike
# single-instance below, so it's registered unconditionally in lib.rs.
tauri-plugin-notification = "2"

# The process-tree RAM/CPU gauge is a desktop-only feature; it's meaningless
# on mobile (no equivalent OS process tree to walk) and sysinfo's "system"
# feature isn't targeted at iOS/Android, so keep it off those builds entirely.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
# Desktop-only (the plugin itself isn't meaningful on mobile, which has no
# concept of "a second copy of this app already running"): refuses to let a
# second instance of the app start up and instead focuses the existing
# window. Without this, launching the app twice gave each process its own
# independent webview and local storage, and on first-ever launch (no
# device keypair saved yet) both would race to generate-and-register a
# SEPARATE device identity with the server for what's really one install --
# see `crypto.ts`'s `ensureDeviceKeypair` doc comment for the full
# "device-identity-split" scenario this closes off at the root.
tauri-plugin-single-instance = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
