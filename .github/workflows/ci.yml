name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server build and unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: svalinn
          POSTGRES_PASSWORD: svalinn_dev
          POSTGRES_DB: svalinn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U svalinn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://svalinn:svalinn_dev@localhost:5432/svalinn_test
      # register_then_login_succeeds_case_insensitively_and_verify_email_works_once
      # asserts on the dev-only verification link, same as a local checkout
      # using .env.example's default.
      APP_ENV: development
      # Test-only values (not real secrets) so email_privacy::init_keys
      # doesn't refuse to start in CI. Generated once with `openssl rand`;
      # safe to be public since nothing they protect exists outside this
      # ephemeral test database.
      EMAIL_ENCRYPTION_KEY: sjaP9fNPQiOdj5s23kGjy6bCtQj3tcO+DQfxmcuAuWo=
      EMAIL_BLIND_INDEX_PEPPER: ci-test-pepper-not-a-real-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p svalinn-server --bins --locked
      - name: Run migrations
        run: cargo run -p svalinn-server --bin run-migrations --locked
      - name: Unit tests
        run: cargo test -p svalinn-server --locked

  desktop:
    name: Desktop app type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm --filter desktop check
      - name: Build frontend
        run: pnpm --filter desktop build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build Tauri backend
        run: cargo build -p svalinn-desktop --locked

  e2e:
    name: API and browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: svalinn
          POSTGRES_PASSWORD: svalinn_dev
          POSTGRES_DB: svalinn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U svalinn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the server
        run: cargo build -p svalinn-server --bins --locked
      - name: Install the test browser
        # apt installs for chromium's OS-level deps occasionally fail on transient
        # Ubuntu-mirror outages (connection resets / unreachable routes on
        # security.ubuntu.com); retry a few times with backoff before giving up.
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter e2e exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Browser install attempt $attempt failed, retrying in 20s..."
            sleep 20
          done
          echo "Browser install failed after 3 attempts" >&2
          exit 1
      - name: Run tests
        run: pnpm test:e2e
      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
